<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Dönüşüm</title>
<meta name="description" content="Diyet planı, yürüyüş zinciri ve dönüşen maskotla motivasyon">
<meta name="theme-color" content="#FFF7EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dönüşüm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="screen" class="screen"></main>
  <nav id="nav" class="nav" hidden>
    <button data-route="today" class="nav-btn" aria-label="Bugün">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Bugün</span></button>
    <button data-route="week" class="nav-btn" aria-label="Hafta">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Hafta</span></button>
    <button data-route="plan" class="nav-btn" aria-label="Plan">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h4"/></svg><span>Plan</span></button>
    <button data-route="me" class="nav-btn" aria-label="Ben">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Ben</span></button>
  </nav>
</div>
<div id="toast" class="toast" hidden></div>
<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" aria-label="Kapat">✕</button>
  <div class="lb-stage"><img alt="Öğün fotoğrafı"></div>
  <div class="lb-actions"><button class="lb-delete">Fotoğrafı sil</button></div>
</div>
<div id="modal" class="modal" hidden><div class="modal-card"></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
